<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#060912"
    >

    <title>
        BoxOfficeX Admin Login
    </title>


    <style>

        :root {
            --bg: #060912;
            --surface: #101728;
            --surface-2: #151d31;
            --border: rgba(255,255,255,0.08);
            --text: #ffffff;
            --muted: #99a5bd;
            --blue: #4d8dff;
            --purple: #795cff;
            --gold: #ffcc33;
            --green: #69d27d;
            --red: #ff4655;
        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(77,141,255,0.22),
                    transparent 34%
                ),
                radial-gradient(
                    circle at 100% 30%,
                    rgba(121,92,255,0.12),
                    transparent 28%
                ),
                linear-gradient(
                    180deg,
                    #070b15 0%,
                    #060912 45%,
                    #080d18 100%
                );
        }


        .login-wrapper {
            width: 100%;
            max-width: 440px;
        }


        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            margin-bottom: 22px;

            font-size: 24px;
            font-weight: 900;
            letter-spacing: 0.7px;
        }


        .brand-icon {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--purple)
                );
        }


        .brand span:last-child {
            color: var(--gold);
        }


        .login-card {
            padding: 30px;

            border:
                1px solid
                var(--border);

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    rgba(17,25,43,0.98),
                    rgba(10,16,29,0.98)
                );

            box-shadow:
                0 22px 70px
                rgba(0,0,0,0.45);
        }


        .login-badge {
            display: inline-flex;

            padding:
                7px 11px;

            margin-bottom: 14px;

            border:
                1px solid
                rgba(77,141,255,0.22);

            border-radius: 999px;

            background:
                rgba(77,141,255,0.08);

            color:
                #79adff;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 0.7px;
        }


        h1 {
            margin-bottom: 8px;

            font-size: 30px;
        }


        .subtitle {
            margin-bottom: 24px;

            color: var(--muted);

            font-size: 14px;

            line-height: 1.6;
        }


        label {
            display: block;

            margin-bottom: 8px;

            font-size: 13px;
            font-weight: 800;
        }


        .field-wrap {
            margin-bottom: 16px;
        }

        .password-wrap {
            position: relative;
        }


        input {
            width: 100%;

            padding:
                14px 48px
                14px 14px;

            border:
                1px solid
                var(--border);

            border-radius: 11px;

            background:
                var(--surface-2);

            color: white;

            font-size: 16px;

            outline: none;
        }


        input:focus {
            border-color:
                rgba(77,141,255,0.70);
        }


        .toggle-password {
            position: absolute;

            top: 50%;
            right: 11px;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            color: #9eabc3;

            cursor: pointer;

            font-size: 18px;
        }


        .login-button {
            width: 100%;

            margin-top: 20px;

            padding: 14px;

            border: none;

            border-radius: 11px;

            background: var(--gold);

            color: #080b14;

            font-size: 16px;

            font-weight: 900;

            cursor: pointer;
        }


        .login-button:hover {
            opacity: 0.92;
        }


        .login-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }


        .message {
            display: none;

            margin-top: 16px;

            padding: 12px;

            border-radius: 10px;

            text-align: center;

            font-size: 13px;

            font-weight: 800;
        }


        .message.success {
            display: block;

            background:
                rgba(105,210,125,0.10);

            border:
                1px solid
                rgba(105,210,125,0.30);

            color: #b9f0c1;
        }


        .message.error {
            display: block;

            background:
                rgba(255,70,85,0.08);

            border:
                1px solid
                rgba(255,70,85,0.28);

            color: #ff9da6;
        }


        .back-home {
            display: block;

            margin-top: 18px;

            text-align: center;

            color: #79adff;

            font-size: 12px;

            font-weight: 700;
        }


        .security-note {
            margin-top: 18px;

            color: #73809a;

            font-size: 11px;

            line-height: 1.6;

            text-align: center;
        }


        @media (max-width: 500px) {

            .login-card {
                padding: 23px;
            }

            h1 {
                font-size: 27px;
            }

        }

    </style>

</head>


<body>


<div class="login-wrapper">


    <div class="brand">

        <span class="brand-icon">
            🎬
        </span>

        BOXOFFICE<span>X</span>

    </div>


    <div class="login-card">


        <div class="login-badge">
            🔐 ADMIN ACCESS
        </div>


        <h1>
            Admin Login
        </h1>


        <p class="subtitle">
            Sign in with your BoxOfficeX admin account.
            Access is controlled by your assigned admin role.
        </p>


        <div class="field-wrap">
            <label for="adminEmail">
                Admin Email
            </label>

            <input
                type="email"
                id="adminEmail"
                placeholder="name@boxoffice-x.com"
                autocomplete="username"
                spellcheck="false"
            >
        </div>


        <label for="adminPassword">
            Admin Password
        </label>


        <div class="password-wrap">

            <input
                type="password"
                id="adminPassword"
                placeholder="Enter admin password"
                autocomplete="current-password"
            >

            <button
                type="button"
                class="toggle-password"
                onclick="togglePassword()"
                aria-label="Show or hide password"
            >
                👁️
            </button>

        </div>


        <button
            id="loginButton"
            class="login-button"
            onclick="loginAdmin()"
        >
            🔐 LOGIN
        </button>


        <div
            id="message"
            class="message"
        ></div>


        <a
            href="index.html"
            class="back-home"
        >
            ← Back to BoxOfficeX
        </a>


        <div class="security-note">
            This page is for authorised BoxOfficeX administrators only.
        </div>


    </div>


</div>


<script>

const API_BASE =
    window.location.origin;


const emailInput =
    document.getElementById(
        "adminEmail"
    );

const passwordInput =
    document.getElementById(
        "adminPassword"
    );


emailInput.addEventListener(
    "keydown",
    function(event) {
        if (event.key === "Enter") {
            passwordInput.focus();
        }
    }
);


passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            loginAdmin();
        }

    }
);


function togglePassword() {

    if (
        passwordInput.type ===
        "password"
    ) {

        passwordInput.type =
            "text";

    } else {

        passwordInput.type =
            "password";

    }

}


function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );

    message.textContent =
        text;

    message.className =
        "message " +
        type;

}


async function loginAdmin() {

    const email =
        emailInput.value.trim().toLowerCase();

    const password =
        passwordInput.value;


    if (!email) {

        showMessage(
            "Please enter your BoxOfficeX admin email.",
            "error"
        );

        emailInput.focus();
        return;
    }


    if (!email.endsWith("@boxoffice-x.com")) {

        showMessage(
            "Please use your @boxoffice-x.com admin email.",
            "error"
        );

        emailInput.focus();
        return;
    }


    if (!password) {

        showMessage(
            "Please enter your admin password.",
            "error"
        );

        return;

    }


    const button =
        document.getElementById(
            "loginButton"
        );


    button.disabled =
        true;

    button.textContent =
        "⏳ LOGGING IN...";


    try {

        const response =
            await fetch(
                API_BASE +
                "/admin/login",
                {

                    method: "POST",

                    credentials:
                        "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            email:
                                email,
                            password:
                                password
                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Login failed"
            );

        }


        const admin =
            data.admin || {};

        const roleLabel =
            String(admin.role || "admin")
                .replace("_", " ")
                .toUpperCase();

        showMessage(
            "✅ " +
            (admin.display_name || admin.email || "Admin") +
            " • " +
            roleLabel +
            " — Opening Admin Portal...",
            "success"
        );


        setTimeout(
            function() {

                const role =
                    String(admin.role || "").toLowerCase();

                if (role === "editor") {
                    window.location.href =
                        "/admin-articles.html";
                }
                else if (role === "data_admin") {
                    window.location.href =
                        "/admin.html";
                }
                else {
                    window.location.href =
                        "/admin.html";
                }

            },
            600
        );


    } catch (error) {

        console.error(
            "Admin login error:",
            error
        );


        showMessage(
            "❌ " +
            error.message,
            "error"
        );


    } finally {

        button.disabled =
            false;

        button.textContent =
            "🔐 LOGIN";

    }

}


/* =====================================================
   CHECK EXISTING SESSION
===================================================== */

fetch(
    API_BASE +
    "/admin/session",
    {
        credentials:
            "include"
    }
)

.then(response =>
    response.json()
)

.then(data => {

    if (
        data.logged_in === true &&
        data.admin
    ) {

        const role =
            String(data.admin.role || "").toLowerCase();

        if (role === "editor") {
            window.location.href =
                "/admin-articles.html";
        }
        else {
            window.location.href =
                "/admin.html";
        }

    }

})

.catch(error => {

    console.log(
        "Session check:",
        error
    );

});

</script>


</body>

</html>
